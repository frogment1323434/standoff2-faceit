<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Standoff 2 Faceit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<!-- Фоновые эффекты -->
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="auth-container">
  <div class="auth-card">

    <!-- Логотип -->
    <div class="auth-logo">
      <div class="auth-logo-icon">⚔️</div>
      <div class="auth-logo-text">
        <span class="auth-logo-main">STANDOFF 2</span>
        <span class="auth-logo-sub">FACEIT PLATFORM</span>
      </div>
    </div>

    <!-- Табы: Вход / Регистрация -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">ВХОД</button>
      <button class="auth-tab" data-tab="register">РЕГИСТРАЦИЯ</button>
    </div>

    <!-- ===== ФОРМА ВХОДА ===== -->
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label>Никнейм</label>
        <input type="text" id="loginNickname" placeholder="Введите ник" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">👁</button>
        </div>
      </div>

      <div class="form-error" id="loginError"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <span class="btn-icon-inner">🔓</span> ВОЙТИ
      </button>
    </form>

    <!-- ===== ФОРМА РЕГИСТРАЦИИ ===== -->
    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label>Никнейм</label>
        <input type="text" id="regNickname" placeholder="3-20 символов" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Минимум 4 символа" autocomplete="new-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label>Повторите пароль</label>
        <div class="password-wrap">
          <input type="password" id="regPassword2" placeholder="Ещё раз" autocomplete="new-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('regPassword2', this)">👁</button>
        </div>
      </div>

      <div class="form-error" id="regError"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <span class="btn-icon-inner">🚀</span> СОЗДАТЬ АККАУНТ
      </button>
    </form>

    <!-- Футер -->
    <div class="auth-footer">
      <span>🎮 5 vs 5 • Рейтинг • Elo система</span>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
